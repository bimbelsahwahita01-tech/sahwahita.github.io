<style>
*{box-sizing:border-box}
:root{--brand:#0b1f4a;--brand2:#1d3f87;--accent:#c9a227;--ink:#10262e;--muted:#5d727b;--bg:#f5f8f9;--card:#fff;--line:#e0e8eb;--ok:#1a936f;--bad:#d1495b;--r:14px;--sh:0 6px 24px rgba(16,38,46,.08)}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.6 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--brand2);text-decoration:none}
img{max-width:100%}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
p{margin:0 0 1em}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--brand);color:#fff;padding:11px 20px;border-radius:10px;font:600 15px/1.2 inherit;font-family:inherit;cursor:pointer;transition:.15s;text-align:center}
.btn:hover{background:var(--brand2)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand2);background:#f0f3fa}
.btn.ghost.on{background:#fff4e6;border-color:var(--accent);color:#9a5b12}
.btn.accent{background:var(--accent);color:#1d1503}
.btn.accent:hover{background:#dbb73d}
.btn.danger{background:var(--bad)}
.btn.danger:hover{background:#b93a4b}
.btn.full{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:99px;background:#e8edf8;color:var(--brand)}
.tag.free{background:#e1f5ec;color:#11704f}
.tag.prem{background:#fff0dc;color:#9a5b12}
/* header */
header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;color:var(--brand);font-size:19px}
.brand img{height:46px;width:46px;object-fit:contain;border-radius:50%;background:#fff}
nav.main{display:flex;align-items:center;gap:4px;margin-left:auto}
nav.main>a,.ddb{color:var(--ink);padding:8px 12px;border-radius:8px;font-weight:600;font-size:15px;background:none;border:0;cursor:pointer;font-family:inherit}
nav.main>a:hover,.ddb:hover,.dd:hover .ddb{background:#eef1f9;color:var(--brand)}
.dd{position:relative}
.ddm{display:none;position:absolute;top:100%;left:0;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:8px;max-height:70vh;overflow:auto}
.dd:hover .ddm,.dd.open .ddm{display:block}
.ddm a{display:block;padding:8px 12px;border-radius:8px;color:var(--ink);font-size:14.5px}
.ddm a:hover{background:#eef1f9}
.ddm a.sub{padding-left:28px;color:var(--muted);font-size:14px}
.burger{display:none;margin-left:auto;background:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:20px;cursor:pointer}
/* hero */
.hero{background:linear-gradient(135deg,#071533 0%,#0b1f4a 55%,#1d3f87 100%);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:520px;height:520px;right:-120px;top:-180px;background:radial-gradient(circle,rgba(201,162,39,.38),transparent 65%)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:72px;position:relative}
.hero .badge{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:5px 14px;border-radius:99px;font-size:13px;font-weight:600;margin-bottom:18px}
.hero h1{font-size:clamp(30px,4.4vw,48px);letter-spacing:-.02em}
.hero p.sub{font-size:18px;opacity:.9;max-width:560px;margin-bottom:26px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.herologo{text-align:center}.herologo img{width:min(340px,100%);border-radius:50%;box-shadow:0 24px 60px rgba(0,0,0,.4);background:#fff}
.mock{display:none;background:#fff;color:var(--ink);border-radius:18px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.28);transform:rotate(1.5deg)}
.mock .mh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:600}
.mock .mh b{color:var(--bad)}
.mock .mq{font-weight:700;margin-bottom:12px}
.mock .mo{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:14px}
.mock .mo i{font-style:normal;font-weight:800;width:24px;height:24px;border-radius:50%;background:#eef1f9;display:grid;place-items:center;font-size:12px;color:var(--brand)}
.mock .mo.on{border-color:var(--ok);background:#effaf5}.mock .mo.on i{background:var(--ok);color:#fff}
/* sections */
section.s{padding:56px 0}
section.s.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sh h2{font-size:28px;margin:0}
.sh p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.quick a{display:block;padding:18px;text-align:left;color:var(--ink)}
.quick a b{display:block;color:var(--brand);margin-bottom:2px}
.quick a span{font-size:14px;color:var(--muted)}
.quick a:hover{border-color:var(--brand2);transform:translateY(-2px)}
.quick a{transition:.15s}
.cat{overflow:hidden;display:flex;flex-direction:column;transition:.15s;color:var(--ink)}
.cat:hover{transform:translateY(-3px)}
.cat .ci{height:130px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-size:44px;font-weight:800;background-size:cover;background-position:center}
.cat .cb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat h3{font-size:18px;margin:0}
.cat p{color:var(--muted);font-size:14px;margin:0;flex:1}
.pk{padding:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink);transition:.15s}
.pk:hover{transform:translateY(-3px)}
.pk h3{font-size:18px;margin:0}
.pk .meta{color:var(--muted);font-size:14px;flex:1}
.pk .btn{align-self:flex-start}
.art{overflow:hidden;color:var(--ink);display:flex;flex-direction:column;transition:.15s}
.art:hover{transform:translateY(-3px)}
.art .ai{height:160px;background:linear-gradient(135deg,#e8f2f4,#cfe3e7) center/cover}
.art .ab{padding:16px;display:flex;flex-direction:column;gap:6px}
.art h3{font-size:17px;margin:0}
.art small{color:var(--muted)}
.feat{padding:24px}
.feat .ic{width:46px;height:46px;border-radius:12px;background:#fff0dc;display:grid;place-items:center;font-size:22px;margin-bottom:12px}
.cta-band{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:22px;padding:40px;text-align:center}
.cta-band h2{font-size:28px}
.empty{padding:36px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r);background:#fff}
.crumb{font-size:14px;color:var(--muted);margin:26px 0 16px}
.crumb a{color:var(--muted)}
.page{padding-bottom:60px;min-height:55vh}
.page h1{font-size:32px}
.prose{max-width:760px;font-size:17px}
.prose img.cover{width:100%;border-radius:14px;margin-bottom:20px}
.price{padding:28px;display:flex;flex-direction:column;gap:10px;position:relative}
.price.hl{border:2px solid var(--accent)}
.price.hl:before{content:"Terpopuler";position:absolute;top:-12px;left:24px;background:var(--accent);color:#3b2406;font-size:12px;font-weight:800;padding:3px 12px;border-radius:99px}
.price .amt{font-size:34px;font-weight:800;color:var(--brand)}
.price .amt small{font-size:14px;font-weight:600;color:var(--muted)}

const sig=(pos,d)=>pos+JSON.stringify(d,(k,v)=>stable(v));
function rowsOf(){
  const r=[{kind:'settings',id:'main',pos:0,data:DB.settings}];
  KINDS.forEach(k=>DB[k].forEach((it,i)=>r.push({kind:k,id:it.id,pos:i,data:it})));

}

}

async function toStorage(dataUrl,name){
  if(!dataUrl||!dataUrl.startsWith('data:'))return dataUrl;
  const blob=await (await fetch(dataUrl)).blob();
  const ext=((name||'').match(/\.([A-Za-z0-9]{1,8})$/)||[])[1]||(blob.type.split('/')[1]||'bin').replace('jpeg','jpg').replace(/\+.*/,'');
  const base=(name||'file').replace(/\.[^.]*$/,'').replace(/[^A-Za-z0-9_-]+/g,'-').slice(0,40)||'file';
  const path=`${Date.now()}-${uid()}-${base}.${ext}`;
  const {error}=await sb.storage.from('uploads').upload(path,blob,{contentType:blob.type||'application/octet-stream'});
  if(error)throw new Error('Upload gagal: '+error.message);
  return sb.storage.from('uploads').getPublicUrl(path).data.publicUrl;
}

let T=null,TI=null;
function startTryout(id){
  const pkg=byId(DB.packages,id);if(!pkg||!unlocked(pkg))return;
  if(!pkg.questions.length)return toast('Paket ini belum berisi soal',1);
  T={pkg,ans:Array(pkg.questions.length).fill(-1),flag:new Set(),i:0,end:Date.now()+pkg.duration*60000,done:false};
  clearInterval(TI);TI=setInterval(tick,1000);
  location.hash='#/tryout/'+id;
}
function tick(){
  if(!T||T.done){clearInterval(TI);return}
  const left=Math.max(0,Math.round((T.end-Date.now())/1000)),el=$('#timer');
  if(el){const h=String(Math.floor(left/3600)).padStart(2,'0'),m=String(Math.floor(left%3600/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');el.textContent=`${h}:${m}:${s}`;el.classList.toggle('low',left<300)}
  if(left<=0){toast('Waktu habis, jawaban dikumpulkan');finishTryout(true)}
}
function tryoutView(){
  const {pkg,i}=T,q=pkg.questions[i],n=pkg.questions.length;
  const nums=pkg.questions.map((_,k)=>`<button data-go="${k}" class="${T.flag.has(k)?'f':T.ans[k]>=0?'a':''} ${k===i?'c':''}">${k+1}</button>`).join('');
  return `<div class="wrap tryout"><div class="card tq">
   <div class="tqh"><span>${esc(pkg.title)} · Soal ${i+1} dari ${n}</span>${q.sec?`<span class="tag">${esc(q.sec)}</span>`:''}</div>
   <div class="qtext">${para(q.q)}${imgs(q.imgs)}</div>
   <div class="opts">${q.opts.map((o,k)=>hasOpt(q,k)?`<button class="opt ${T.ans[i]===k?'sel':''}" data-opt="${k}"><b>${LET[k]}</b><span>${esc(o)}${oimg(q.oimgs&&q.oimgs[k])}</span></button>`:'').join('')}</div>
   <div class="tqf"><button class="btn ghost" data-nav="-1" ${i===0?'disabled':''}>← Sebelumnya</button><button class="btn ghost ${T.flag.has(i)?'on':''}" data-flag>⚑ Ragu-ragu</button><button class="btn" data-nav="1" ${i===n-1?'disabled':''}>Selanjutnya →</button></div></div>
   <aside class="card tside"><div class="timer" id="timer">--:--:--</div><div class="nums">${nums}</div>
   <div class="legend"><span><i style="background:var(--brand)"></i>Dijawab</span><span><i style="background:var(--accent)"></i>Ragu</span><span><i style="background:#fff;border:1.5px solid var(--line)"></i>Kosong</span></div>
   <button class="btn danger full" data-finish>Selesai & lihat skor</button></aside></div>`;
}
let LAST=null;
function finishTryout(auto){
  if(!T)return;
  const blank=T.ans.filter(a=>a<0).length;
  if(!auto&&!confirm(blank?`Masih ada ${blank} soal belum dijawab. Selesaikan tryout?`:'Selesaikan tryout sekarang?'))return;
  T.done=true;clearInterval(TI);
  const qs=T.pkg.questions;let correct=0,wrong=0;const sec={};
  qs.forEach((q,i)=>{const s=q.sec||'Umum';sec[s]=sec[s]||{c:0,t:0};sec[s].t++;if(T.ans[i]===q.ans){correct++;sec[s].c++}else if(T.ans[i]>=0)wrong++});
  const score=Math.round(correct/qs.length*100);
  LAST={pkg:T.pkg,ans:T.ans,correct,wrong,blank:qs.length-correct-wrong,score,sec};
  const h=JSON.parse(localStorage.getItem('sw_hist')||'{}');h[T.pkg.id]=[{score,correct,total:qs.length,date:Date.now()},...(h[T.pkg.id]||[])].slice(0,5);
  try{localStorage.setItem('sw_hist',JSON.stringify(h))}catch(e){}
  T=null;location.hash='#/hasil/'+LAST.pkg.id;
}

const MAXF=8*1024*1024;
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}
function readImage(f){return new Promise(async(res)=>{
  const raw=await readFile(f);
  if(f.type==='image/svg+xml'||f.type==='image/gif')return res(raw);
  const img=new Image();img.onload=()=>{try{const M=1400,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))}catch(e){res(raw)}};img.onerror=()=>res(raw);img.src=raw})}
function fieldHTML(f,v){
  const id='f_'+f.name,lbl=`<label for="${id}">${esc(f.label)}${f.hint?`<small>${esc(f.hint)}</small>`:''}</label>`;
  switch(f.type){
    case 'textarea':return `<div class="fld">${lbl}<textarea id="${id}" name="${f.name}" rows="${f.rows||4}" class="${f.mono?'mono':''}">${esc(v)}</textarea></div>`;
    case 'lines':return `<div class="fld">${lbl}<textarea id="${id}" name="${f.name}" rows="${f.rows||5}">${esc((v||[]).join('\n'))}</textarea></div>`;
    case 'select':return `<div class="fld">${lbl}<select id="${id}" name="${f.name}">${f.options.map(([val,t])=>`<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
    case 'note':return `<div class="note">${f.html}</div>`;
    case 'rawfile':return `<div class="fld">${lbl}<input type="file" id="${id}" name="${f.name}" accept="${f.accept||''}"></div>`;
    case 'checkbox':return `<label class="chk"><input type="checkbox" name="${f.name}" ${v?'checked':''}> ${esc(f.label)}</label>`;
    case 'image':return `<div class="fld">${lbl}<input type="file" id="${id}" name="${f.name}" accept="image/*">${v?`<div class="prev"><img src="${v}" alt=""><label><input type="checkbox" data-clear="${f.name}"> Hapus gambar ini</label></div>`:''}</div>`;
    case 'file':return `<div class="fld">${lbl}<input type="file" id="${id}" name="${f.name}">${v?`<div class="prev">File saat ini: <b>${esc(f.nameVal||'terunggah')}</b> <label><input type="checkbox" data-clear="${f.name}"> Hapus file</label></div>`:''}</div>`;
    default:return `<div class="fld">${lbl}<input id="${id}" name="${f.name}" type="${f.type||'text'}" value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}></div>`;
  }
}
async function readForm(form,fields,old={}){
  const out={};
  for(const f of fields){
    if(f.type==='note')continue;
    const el=form.elements[f.name];
    if(f.type==='rawfile'){out[f.name]=el.files[0]||null;if(f.req&&!out[f.name])throw new Error(`${f.label} wajib dipilih`);continue}
    if(f.type==='checkbox'){out[f.name]=el.checked;continue}
    if(f.type==='lines'){out[f.name]=el.value.split('\n').map(s=>s.trim()).filter(Boolean);continue}
    if(f.type==='image'||f.type==='file'){
      const file=el.files[0],clear=form.querySelector(`[data-clear="${f.name}"]`)?.checked;
      if(file){
        if(file.size>MAXF)throw new Error(`File "${file.name}" lebih dari 8 MB`);
        out[f.name]=await toStorage(f.type==='image'?await readImage(file):await readFile(file),file.name);
        if(f.type==='file')out[f.name+'Name']=file.name;
      }else if(clear){out[f.name]='';if(f.type==='file')out[f.name+'Name']=''}
      else{out[f.name]=old[f.name]||'';if(f.type==='file')out[f.name+'Name']=old[f.name+'Name']||''}
      continue;
    }
    let val=el.value;
    if(f.type==='number')val=Number(val)||0;else if(f.type!=='textarea')val=val.trim();
    if(f.req&&(val===''||val===0&&f.type==='number'))throw new Error(`${f.label} wajib diisi`);
    out[f.name]=val;
  }
  return out;
}
function closeModal(){$('#modal').className='';$('#modal').innerHTML=''}
function formModal({title,fields,values={},onSave,wide,saveText}){
  const m=$('#modal');
  m.innerHTML=`<div class="mbox ${wide?'wide':''}"><div class="mh2"><h3>${esc(title)}</h3><button class="x" data-close type="button">×</button></div><form class="mb" novalidate>${fields.map(f=>fieldHTML(f,values[f.name])).join('')}<div class="mf"><button type="button" class="btn ghost" data-close>Batal</button><button class="btn">${esc(saveText||'Simpan')}</button></div></form></div>`;
  m.className='on';
  m.querySelector('form').onsubmit=async e=>{
    e.preventDefault();const btn=e.target.querySelector('.btn:not(.ghost)');btn.disabled=true;
    try{const v=await readForm(e.target,fields,values);await onSave(v);closeModal()}
    catch(err){toast(err.message,1)}finally{btn.disabled=false}
  };
  const first=m.querySelector('input:not([type=file]):not([type=checkbox]),textarea');first&&first.focus();
}

function parseBulk(txt){
  const blocks=txt.replace(/\r/g,'').split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean),out=[],errs=[];
  blocks.forEach((b,bi)=>{
    let q=[],opts=['','','','',''],ans=-1,expl='',sec='',cur='q',m;
    for(const ln of b.split('\n')){
      if((m=ln.match(/^\s*([A-Ea-e])[\.\)]\s+(.*)$/))){const k=LET.indexOf(m[1].toUpperCase());opts[k]=m[2].trim();cur='o'+k;continue}
      if((m=ln.match(/^\s*jawaban\s*:\s*([A-Ea-e])/i))){ans=LET.indexOf(m[1].toUpperCase());cur='';continue}
      if((m=ln.match(/^\s*pembahasan\s*:\s*(.*)$/i))){expl=m[1];cur='e';continue}
      if((m=ln.match(/^\s*bagian\s*:\s*(.*)$/i))){sec=m[1].trim();cur='';continue}
      if(cur==='q')q.push(ln);else if(cur==='e')expl+='\n'+ln;else if(cur[0]==='o')opts[+cur[1]]+=' '+ln.trim();
    }
    const qt=q.join('\n').trim().replace(/^\d+[\.\)]\s*/,'');
    if(!qt||opts.filter(Boolean).length<2||ans<0||!opts[ans])errs.push(bi+1);else out.push({sec,q:qt,opts,ans,expl:expl.trim()});
  });
  return{out,errs};
}

/* ============ impor Word (.docx) & sub-menu standar ============ */
const OKIMG=/^data:image\/(png|jpe?g|gif|webp|bmp|svg\+xml)/i;
function shrinkData(u){return new Promise(res=>{
  if(!/^data:image\/(png|jpe?g|webp|bmp)/i.test(u))return res(u);
  const im=new Image();
  im.onload=()=>{try{const M=1400,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.88))}catch(e){res(u)}};
  im.onerror=()=>res(u);im.src=u});}
async function parseDocx(file,defSec){
  if(!window.mammoth)throw new Error('Library Word gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.');
  if(!/\.docx$/i.test(file.name))throw new Error('Gunakan file .docx (Word). Jika file .doc, buka di Word lalu Save As .docx.');
  const buf=await file.arrayBuffer();
  const res=await mammoth.convertToHtml({arrayBuffer:buf},{convertImage:mammoth.images.imgElement(im=>im.read('base64').then(b=>({src:'data:'+im.contentType+';base64,'+b})))});
  const doc=new DOMParser().parseFromString(res.value,'text/html');
  const sel='p,li,h1,h2,h3,h4,h5,h6';
  let skipped=0;
  const lines=[...doc.body.querySelectorAll(sel)].filter(e=>!e.querySelector(sel)).map(e=>({
    t:(e.textContent||'').replace(/ /g,' ').replace(/\s+/g,' ').trim(),
    im:[...e.querySelectorAll('img')].map(i=>i.getAttribute('src')).filter(u=>{if(OKIMG.test(u))return true;skipped++;return false})}));
  const hasNum=lines.some(l=>/^\d+\s*[.)]\s/.test(l.t));
  const out=[],warn=[];let cur=null,pend=defSec||'';
  const fresh=()=>({sec:pend,q:[],qi:[],opts:['','','','',''],oi:['','','','',''],ans:-1,expl:[],ei:[],mode:'q',last:-1});
  const flush=()=>{
    if(!cur)return;const c=cur;cur=null;
    const stem=c.q.join('\n').trim(),n=out.length+warn.length+1;
    const ok=k=>c.opts[k]||c.oi[k];
    if((!stem&&!c.qi.length)||[0,1,2,3,4].filter(ok).length<2||c.ans<0||!ok(c.ans)){warn.push(n);return}
    out.push({sec:c.sec,q:stem,imgs:c.qi,opts:c.opts.map(o=>o.trim()),oimgs:c.oi.map(x=>x||''),ans:c.ans,expl:c.expl.join('\n').trim(),eimgs:c.ei});
  };
  for(const L of lines){
    const t=L.t;let m;
    if(!t&&!L.im.length){if(cur&&cur.ans>=0)flush();continue}
    if((m=t.match(/^(?:bagian|kategori)\s*[:=]\s*(.+)$/i))){if(cur)cur.sec=m[1].trim();else pend=m[1].trim();continue}
    if((m=t.match(/^(\d+)\s*[.)]\s*(.*)$/))&&(!cur||cur.ans>=0||cur.last>=1)){
      flush();cur=fresh();cur.mode='q';if(m[2])cur.q.push(m[2]);cur.qi.push(...L.im);continue}
    if(!cur){if(hasNum)continue;cur=fresh()}
    if(cur.mode!=='e'&&(m=t.match(/^([A-Ea-e])\s*[.)]\s*(.*)$/))&&LET.indexOf(m[1].toUpperCase())>cur.last&&(cur.q.length||cur.qi.length||cur.last>=0)){
      const k=LET.indexOf(m[1].toUpperCase());cur.last=k;cur.mode='o';cur.opts[k]=m[2];if(L.im.length)cur.oi[k]=L.im[0];continue}
    if((m=t.match(/^(?:jawaban|kunci)(?:\s+benar)?\s*[:=]\s*([A-Ea-e])/i))){cur.ans=LET.indexOf(m[1].toUpperCase());cur.mode='a';cur.ei.push(...L.im);continue}
    if((m=t.match(/^(?:pembahasan|penjelasan)\s*[:=]?\s*(.*)$/i))){cur.mode='e';if(m[1])cur.expl.push(m[1]);cur.ei.push(...L.im);continue}
    if(cur.mode==='q'){if(t)cur.q.push(t);cur.qi.push(...L.im)}
    else if(cur.mode==='o'){if(t)cur.opts[cur.last]=(cur.opts[cur.last]+' '+t).trim();if(L.im.length&&!cur.oi[cur.last])cur.oi[cur.last]=L.im[0]}
    else{if(t&&cur.mode==='e')cur.expl.push(t);cur.ei.push(...L.im)}
  }
  flush();
  return{qs:out,warn,skipped};
}
async function docxToQuestions(file,defSec){
  const r=await parseDocx(file,defSec);
  if(!r.qs.length)throw new Error('Tidak ada soal valid di file Word. Pastikan format: "1. soal", "A. pilihan", "Jawaban: B" (ketik manual, bukan penomoran otomatis Word).');
  const urls=[...new Set(r.qs.flatMap(q=>[...q.imgs,...q.oimgs.filter(Boolean),...q.eimgs]))],map={};
  let n=0;
  for(const u of urls){n++;toast(`Mengunggah gambar ${n} dari ${urls.length}…`);map[u]=await toStorage(await shrinkData(u),'soal.jpg')}
  const mp=a=>a.map(u=>map[u]||u);
  r.qs.forEach(q=>{q.imgs=mp(q.imgs);q.oimgs=q.oimgs.map(u=>u?map[u]||u:'');q.eimgs=mp(q.eimgs)});
  return r;
}

    onSave:async v=>{
      let pid=v.parent;
      if(pid==='__new'){let sk=byId(DB.categories,'skd');if(!sk){sk={id:'skd',name:'Seleksi Kompetensi Dasar (SKD)',parent:'',desc:'TWK, TIU, dan TKP untuk CPNS, PPPK, dan Sekolah Kedinasan.',image:''};DB.categories.unshift(sk)}pid=sk.id}
      let n=0;
      [['TWK','Tes Wawasan Kebangsaan'],['TIU','Tes Intelegensia Umum'],['TKP','Tes Karakteristik Pribadi']].forEach(([k,d])=>{
        if(!DB.categories.some(c=>c.parent===pid&&c.name.toUpperCase().startsWith(k))){DB.categories.push({id:uid(),name:k,parent:pid,desc:d,image:''});n++}});
      await save();render();toast(n?`${n} sub-menu dibuat`:'Sub-menu sudah ada')}});
}

function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ============ router ============ */
function render(){
  if(!DB)return;
  document.body.classList.remove('is-admin');
  const parts=location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent),[r,a,b]=parts;
  if(r!=='tryout'&&T){T.done=true;clearInterval(TI);T=null}
  let html;
  shell();document.title=S().siteName+' · '+S().tagline;
  if(r==='admin'){html=adminView(a,b);if(isAdmin())document.body.classList.add('is-admin')}
  else if(r==='tryout'){html=T&&T.pkg.id===a?tryoutView():`<div class="wrap page" style="padding-top:60px"><div class="empty">Sesi tryout tidak aktif. <a href="#/paket/${esc(a)}">Kembali ke paket</a></div></div>`}
  else if(r==='hasil')html=resultView();
  else if(r==='kategori')html=pages.kategori(a);
  else if(r==='paket')html=pages.paket(a);
  else if(r==='artikel')html=pages.artikel(a);
  else if(pages[r]&&r!=='kategori')html=pages[r]();
  else html=r?nf():pages.home();
  $('#view').innerHTML=html;
  window.scrollTo(0,0);
  if(r==='tryout')tick();
  $('#nav').classList.remove('open');
  const lf=$('#loginf');if(lf)lf.onsubmit=async e=>{e.preventDefault();const b=lf.querySelector('.btn');b.disabled=true;const {error}=await sb.auth.signInWithPassword({email:lf.em.value.trim(),password:lf.pw.value});b.disabled=false;if(error)toast('Login gagal: email atau password salah',1);else{ADMIN=true;render()}};
  const sf=$('#setf');if(sf)sf.onsubmit=async e=>{e.preventDefault();try{
    const v=await readForm(sf,window._sf,S());const np=v.newPassword;delete v.newPassword;
    if(np){if(np.length<6)throw new Error('Password minimal 6 karakter');const {error}=await sb.auth.updateUser({password:np});if(error)throw new Error(error.message)}
    Object.assign(DB.settings,v);await save();render();toast(np?'Pengaturan dan password disimpan':'Pengaturan disimpan')}catch(err){toast(err.message,1)}};
  const bk=$('#bkfile');if(bk)bk.onchange=async()=>{try{
    const d=JSON.parse(await bk.files[0].text());if(!d.settings||!Array.isArray(d.categories)||!Array.isArray(d.packages))throw 0;
    if(!confirm('Ganti seluruh data dengan isi backup ini?'))return;
    delete d.settings.password;const base=seed();DB={settings:{...base.settings,...d.settings}};KINDS.forEach(k=>DB[k]=d[k]||[]);await save();render();toast('Backup dipulihkan')}catch(e){toast('File backup tidak valid',1)}};
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a,.dd');if(!t)return;
  if(t.matches('[data-close]')||e.target.id==='modal'){closeModal();return}
  if(t.id==='burger'||t.closest('#burger')){$('#nav').classList.toggle('open');return}
  if(t.matches('.ddb')){t.parentElement.classList.toggle('open');return}
  if(t.dataset.start)return startTryout(t.dataset.start);
  if(t.dataset.unlock){const p=byId(DB.packages,t.dataset.unlock),v=$('#ucode').value.trim();
    if(p.code&&v===p.code){const l=JSON.parse(localStorage.getItem('sw_unlock')||'[]');l.push(p.id);localStorage.setItem('sw_unlock',JSON.stringify(l));toast('Paket terbuka');render()}else toast('Kode akses salah',1);return}
  if(T){
    if(t.dataset.opt!==undefined){T.ans[T.i]=+t.dataset.opt;$('#view').innerHTML=tryoutView();tick();return}
    if(t.dataset.nav){T.i+=+t.dataset.nav;$('#view').innerHTML=tryoutView();tick();return}
    if(t.dataset.go!==undefined){T.i=+t.dataset.go;$('#view').innerHTML=tryoutView();tick();return}
    if(t.matches('[data-flag]')){T.flag.has(T.i)?T.flag.delete(T.i):T.flag.add(T.i);$('#view').innerHTML=tryoutView();tick();return}
    if(t.matches('[data-finish]'))return finishTryout();
  }
  if(t.matches('[data-logout]')){e.preventDefault();await sb.auth.signOut();ADMIN=false;location.hash='#/admin';render();return}
  if(t.dataset.act)return adminAction(t.dataset.act,t.dataset.key,t.dataset.id);
  if(t.dataset.qact){const pid=location.hash.split('/')[3];return questionAction(t.dataset.qact,t.dataset.i,pid)}
  if(t.dataset.bk==='export'){const c=JSON.parse(JSON.stringify(DB));delete c.settings.password;download('sahwahita-backup-'+today()+'.json',JSON.stringify(c))}
  if(t.dataset.bk==='reset'&&confirm('Reset SEMUA data di database ke contoh awal? Tindakan ini tidak bisa dibatalkan.')){try{const sd=seed();DB={settings:{...sd.settings,...DB.settings}};KINDS.forEach(k=>DB[k]=sd[k]);await save();render();toast('Data contoh dimuat')}catch(err){toast(err.message,1);render()}}
});
window.addEventListener('unhandledrejection',e=>{e.preventDefault();toast((e.reason&&e.reason.message)||'Terjadi kesalahan',1);render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',render);
load().then(render);
</script>
